
services:
  backend:
    # Uses local image if available, otherwise pulls from registry
    image: mabouellais/timetable-backend:deploy
    container_name: portfolio-backend
    env_file: [ ./backend/.env ]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 5000
    ports:
      - "0.0.0.0:5000:5000"  # Map host port 5000 to container port 5000 (local testing)
    networks: [portfolio-network]
    restart: unless-stopped
    pull_policy: missing

  frontend:
    # Uses local image if available, otherwise pulls from registry
    image: mabouellais/timetable-frontend:deploy
    container_name: portfolio-frontend
    environment:
      NODE_ENV: production
      API_URL: http://backend:5000  # Server-side (Next.js API routes use Docker network)
      NEXT_PUBLIC_API_URL: http://localhost:5000  # Client-side (for local testing)
    ports:
      - "0.0.0.0:8000:8000"  # Map host port 8000 to container port 8000 (local testing)
    depends_on:
      - backend
    networks: [portfolio-network]
    restart: unless-stopped
    pull_policy: missing

networks:
  portfolio-network:
    driver: bridge
