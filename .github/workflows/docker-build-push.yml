name: Build and Push Docker Images

on:
  push:
    branches:
      - deploy

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: mabouellais/timetable-backend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=deploy,enable={{is_default_branch}}

      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: mabouellais/timetable-frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=deploy,enable={{is_default_branch}}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=registry,ref=mabouellais/timetable-backend:deploy
          cache-to: type=inline

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=registry,ref=mabouellais/timetable-frontend:deploy
          cache-to: type=inline

      - name: Summary
        run: |
          echo "✅ Backend image: mabouellais/timetable-backend:${{ github.ref_name }}"
          echo "✅ Frontend image: mabouellais/timetable-frontend:${{ github.ref_name }}"
          echo "✅ Commit SHA: ${{ github.sha }}"

  deploy-vps:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: vars.VPS_DEPLOY_ENABLED == 'true'

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            APP_DIR="${{ vars.VPS_APP_DIR }}"
            APP_DIR="${APP_DIR:-$HOME/portfolio}"
            cd "$APP_DIR"
            git pull origin deploy 2>/dev/null || true
            bash cicd/deployment/05-deploy-app.sh
